faq:
  title: คำถามที่พบบ่อย
  description: รวบรวมคำถามและคำตอบที่ผู้ใช้งานสอบถามเข้ามาบ่อยที่สุด
  items:
    - label: ระบบมีความปลอดภัยหรือไม่?
      content: ระบบของเรามีการเข้ารหัสข้อมูลและได้รับการรับรองมาตรฐานความปลอดภัย พร้อมการตรวจสอบความปลอดภัยอย่างสม่ำเสมอ เพื่อปกป้องข้อมูลของผู้ใช้งาน
      defaultOpen: true
    - label: ต้องการยกเลิกการใช้งานต้องทำอย่างไร?
      content: ท่านสามารถติดต่อเจ้าหน้าที่ผ่านช่องทางการติดต่อของเราเพื่อดำเนินการยกเลิกการใช้งานได้ โดยแจ้งล่วงหน้าอย่างน้อย 30 วัน
    - label: ทดลองใช้งานฟรีทำงานอย่างไร?
      content: เราให้ท่านทดลองใช้งานระบบได้ฟรี 30 วัน พร้อมฟีเจอร์การใช้งานครบถ้วน ไม่มีค่าใช้จ่ายแอบแฝง
    - label: สามารถเปลี่ยนแผนการใช้งานภายหลังได้หรือไม่?
      content: สามารถเปลี่ยนแผนการใช้งานได้ตลอดเวลา โดยค่าบริการจะปรับตามแผนใหม่ในรอบบิลถัดไป
    - label: มีนโยบายคืนเงินอย่างไร?
      content: เรามีนโยบายคืนเงินภายใน 14 วันหากท่านไม่พึงพอใจกับการใช้งาน โดยไม่มีค่าใช้จ่ายใดๆ
    - label: มีบริการช่วยเหลือหรือไม่?
      content: เรามีทีมสนับสนุนพร้อมให้ความช่วยเหลือตลอด 24 ชั่วโมง ผ่านช่องทางโทรศัพท์ อีเมล และแชท
