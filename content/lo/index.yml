faq:
  title: ຄຳຖາມທີ່ຖືກຖາມເລື້ອຍໆ
  description: ລວບລວມຄຳຖາມ ແລະ ຄຳຕອບທີ່ຜູ້ໃຊ້ສອບຖາມເຂົ້າມາຫຼາຍທີ່ສຸດ
  items:
    - label: ລະບົບມີຄວາມປອດໄພບໍ່?
      content: ລະບົບຂອງພວກເຮົາມີການເຂົ້າລະຫັດຂໍ້ມູນ ແລະ ໄດ້ຮັບການຮັບຮອງມາດຕະຖານຄວາມປອດໄພ ພ້ອມການກວດສອບຄວາມປອດໄພເປັນປະຈຳ ເພື່ອປົກປ້ອງຂໍ້ມູນຂອງຜູ້ໃຊ້
      defaultOpen: true
    - label: ຕ້ອງການຍົກເລີກການໃຊ້ງານຕ້ອງເຮັດແນວໃດ?
      content: ທ່ານສາມາດຕິດຕໍ່ພະນັກງານຜ່ານຊ່ອງທາງການຕິດຕໍ່ຂອງພວກເຮົາເພື່ອດຳເນີນການຍົກເລີກການໃຊ້ງານໄດ້ ໂດຍແຈ້ງລ່ວງໜ້າຢ່າງໜ້ອຍ 30 ວັນ
    - label: ທົດລອງໃຊ້ງານຟຣີເຮັດວຽກແນວໃດ?
      content: ພວກເຮົາໃຫ້ທ່ານທົດລອງໃຊ້ງານລະບົບໄດ້ຟຣີ 30 ວັນ ພ້ອມຟີເຈີການໃຊ້ງານຄົບຖ້ວນ ບໍ່ມີຄ່າໃຊ້ຈ່າຍແອບແຝງ
    - label: ສາມາດປ່ຽນແຜນການໃຊ້ງານພາຍຫຼັງໄດ້ບໍ່?
      content: ສາມາດປ່ຽນແຜນການໃຊ້ງານໄດ້ຕະຫຼອດເວລາ ໂດຍຄ່າບໍລິການຈະປັບຕາມແຜນໃໝ່ໃນຮອບບິນຕໍ່ໄປ
    - label: ມີນະໂຍບາຍຄືນເງິນແນວໃດ?
      content: ພວກເຮົາມີນະໂຍບາຍຄືນເງິນພາຍໃນ 14 ວັນ ຖ້າທ່ານບໍ່ພໍໃຈກັບການໃຊ້ງານ ໂດຍບໍ່ມີຄ່າໃຊ້ຈ່າຍໃດໆ
    - label: ມີບໍລິການຊ່ວຍເຫຼືອບໍ່?
      content: ພວກເຮົາມີທີມສະໜັບສະໜູນພ້ອມໃຫ້ການຊ່ວຍເຫຼືອຕະຫຼອດ 24 ຊົ່ວໂມງ ຜ່ານຊ່ອງທາງໂທລະສັບ ອີເມວ ແລະ ແຊັດ
